---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-webui
  namespace: garage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garage-webui
  template:
    metadata:
      labels:
        app: garage-webui
    spec:
      containers:
        - name: webui
          image: khairul169/garage-webui:latest
          imagePullPolicy: Always
          env:
            - name: API_BASE_URL
              value: "http://garage-headless:3903"
            - name: S3_ENDPOINT_URL
              value: "http://garage-headless:3900"
            - name: AUTH_USER_PASS
              valueFrom:
                secretKeyRef:
                  name: garage-webui-auth
                  key: AUTH_USER_PASS
          ports:
            - name: http
              containerPort: 3909
              hostPort: 9001
          volumeMounts:
            - name: garage-config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
      volumes:
        - name: garage-config
          configMap:
            name: garage-config
---
apiVersion: v1
kind: Service
metadata:
  name: garage-webui
  namespace: garage
spec:
  type: ClusterIP
  selector:
    app: garage-webui
  ports:
    - name: http
      port: 3909
      targetPort: http
