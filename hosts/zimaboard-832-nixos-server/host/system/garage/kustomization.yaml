# kustomize build --enable-alpha-plugins --enable-exec | k apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: garage
resources:
  - namespace.yaml
  - garage.yaml
  - webui.yaml

generators:
  - ksops.yaml

sortOptions:
  order: legacy
  legacySortOptions:
    orderFirst:
      - Secret
      - ConfigMap

generatorOptions:
  disableNameSuffixHash: true
