name: Renovate Hash Fix

on:
  pull_request:
    types: [opened, synchronize]
    branches: ["*"]

jobs:
  fix-hash:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Fix hashes
        env:
          BASE_REF: origin/${{ github.base_ref }}
          FAKE: sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          changed=$(git diff --name-only "$BASE_REF" HEAD -- 'packages/**/*.nix')
          [ -z "$changed" ] && { echo "No changed nix files in packages/"; exit 0; }

          # Find every Renovate-managed SRI sha256 value in changed files.
          # darwinOutputHash is maintained manually because it cannot be built on Linux.
          # Returns: "<file>:<line>:<original_hash>" for each
          find_all_hashes() {
            for file in $changed; do
              [ -f "$file" ] || continue
              grep -nP '^\s*\w+\s*=\s*"sha256-' "$file" 2>/dev/null \
                | grep -v 'darwinOutputHash' \
                | sed -E 's/^([0-9]+):.*"sha256-([^"]+)".*/\1:sha256-\2/' \
                | while IFS=: read -r ln hash; do
                    [ "$hash" = "$FAKE" ] && continue
                    echo "$file:$ln:$hash"
                  done
            done
          }

          # Extract correct hash from nix error output
          extract_hash() {
            grep -oP 'got:    sha256-\K[0-9a-zA-Z+/=]+' | head -1 || true
          }

          # Detect current system dynamically
          SYSTEM="$(uname -m)-linux"

          # Discover all nixosConfiguration host names dynamically
          get_hosts() {
            nix eval --json .#nixosConfigurations --apply 'builtins.attrNames' 2>/dev/null \
              | tr -d '[]" ' | tr ',' ' '
          }

          # Try to trigger the hash mismatch via targeted build
          trigger_build() {
            local file="$1"
            local got=""

            # Strategy 1: build the specific package directly by pname
            # Skip if pname contains $ (template string, not a real name)
            local pname=$(grep -oP 'pname\s*=\s*"\K[^"]+' "$file" 2>/dev/null | head -1)
            if [ -n "$pname" ] && [[ "$pname" != *'$'* ]]; then
              local drv=""
              drv=$(timeout 60 nix eval --raw .#legacyPackages."$SYSTEM"."$pname".drvPath 2>/dev/null) || \
              drv=$(timeout 60 nix eval --raw .#packages."$SYSTEM"."$pname".drvPath 2>/dev/null)
              if [ -n "$drv" ]; then
                got=$(timeout 300 nix-store -r "$drv" 2>&1 | extract_hash)
              fi
            fi

            # Strategy 1.5: try all legacyPackages function attributes
            # Discovers functions dynamically using only builtins, evaluates drvPath, then builds it
            if [ -z "$got" ]; then
              local ext_name=$(basename "$file" .nix)
              local funcs=$(timeout 60 nix eval --json .#legacyPackages."$SYSTEM" --apply \
                'attrs: builtins.concatMap (n: let v = builtins.tryEval (attrs.${n}); in if v.success && builtins.isFunction v.value then [n] else []) (builtins.attrNames attrs)' 2>/dev/null \
                | tr -d '[]" ' | tr ',' ' ')
              for func in $funcs; do
                local drv=$(timeout 60 nix eval --raw .#legacyPackages."$SYSTEM"."$func" \
                  --apply "f: (f [\"$ext_name\"]).\"$ext_name\".drvPath" 2>/dev/null)
                if [ -n "$drv" ]; then
                  got=$(timeout 300 nix-store -r "$drv" 2>&1 | extract_hash)
                  [ -n "$got" ] && break
                fi
              done
            fi

            # Strategy 2: build first nixosConfiguration (forces home-manager → vicinae → raycastExtensions)
            if [ -z "$got" ]; then
              local first_host=$(get_hosts | awk '{print $1}')
              if [ -n "$first_host" ]; then
                got=$(timeout 300 nix build .#nixosConfigurations."$first_host".config.system.build.toplevel --no-link 2>&1 | extract_hash)
              fi
            fi

            echo "$got"
          }

          # Process each hash: set FAKE → trigger build → write correct hash
          find_all_hashes | while IFS=: read -r file ln original; do
            echo "=== $file:$ln ==="
            sed -i "${ln}s|sha256-[^\"]*|$FAKE|" "$file"

            got=$(trigger_build "$file")

            if [ -n "$got" ]; then
              sed -i "${ln}s|sha256-[^\"]*|sha256-$got|" "$file"
              echo "  -> sha256-$got"
            else
              sed -i "${ln}s|sha256-[^\"]*|$original|" "$file"
              echo "  failed, keeping original"
            fi
          done

      - name: Commit and push
        run: |
          if [[ -z $(git status -s) ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "fix(automated): update nix hashes [skip ci]"
          git push
