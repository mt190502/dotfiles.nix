name: Renovate Hash Fix

on:
  pull_request:
    types: [opened, synchronize]
    branches: ["*"]

jobs:
  fix-hash:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Fix hashes
        env:
          BASE_REF: origin/${{ github.base_ref }}
          FAKE: sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          files=$(git diff --name-only $BASE_REF HEAD -- '*.nix')
          [ -z "$files" ] && exit 0

          for file in $files; do
            echo "=== $file ==="

            # fetchFromGitHub sha256
            for rev in $(git diff $BASE_REF HEAD -- "$file" | grep -oP '^\+.*rev = "\K[^"]+' || true); do
              sha_line=$(grep -n "rev = \"$rev\"" "$file" | head -1 | cut -d: -f1)
              target_line=$(awk -v s="$sha_line" 'NR>s && /sha256 = /{print NR; exit}' "$file")
              [ -z "$target_line" ] && continue

              old=$(sed -n "${target_line}p" "$file" | grep -oP 'sha256 = "\K[^"]+')
              [ "$old" = "$FAKE" ] && continue

              owner=$(grep -B5 "rev = \"$rev\"" "$file" | grep -oP 'owner = "\K[^"]+' | head -1)
              repo=$(grep -B5 "rev = \"$rev\"" "$file" | grep -oP 'repo = "\K[^"]+' | head -1)
              [ -z "$owner" ] || [ -z "$repo" ] && continue

              has_sparse=$(sed -n "${sha_line},$((sha_line+20))p" "$file" | grep -q 'sparseCheckout' && echo "yes" || true)
              hash=""

              # Method 1: nix-prefetch-url (180s for normal, skip for sparse large repos)
              if [ "$has_sparse" != "yes" ]; then
                raw=$(timeout 180 nix-prefetch-url --unpack "https://github.com/$owner/$repo/archive/$rev.tar.gz" 2>/dev/null || true)
                if [ -n "$raw" ]; then
                  hash=$(nix hash convert --hash-algo sha256 --to sri "$raw" 2>/dev/null || true)
                  echo "  sha256: prefetch -> $hash"
                fi
              fi

              # Method 2: fake hash + nix build to get hash from mismatch error
              if [ -z "$hash" ]; then
                echo "  sha256: falling back to nix build"
                sed -i "${target_line}s|sha256 = \"[^\"]*\"|sha256 = \"$FAKE\"|" "$file"

                got=$(timeout 600 nix build .#checks.x86_64-linux.pre-commit --no-link 2>&1 \
                  | grep -oP 'got:    sha256-\K[0-9a-zA-Z+/=]+' | head -1 || true)

                if [ -z "$got" ]; then
                  got=$(timeout 600 nix flake check --all-systems 2>&1 \
                    | grep -oP 'got:    sha256-\K[0-9a-zA-Z+/=]+' | head -1 || true)
                fi

                if [ -n "$got" ]; then
                  hash="sha256-$got"
                  echo "  sha256: nix build -> $hash"
                else
                  sed -i "${target_line}s|sha256 = \"[^\"]*\"|sha256 = \"$old\"|" "$file"
                  echo "  sha256: failed, keeping original"
                fi
              fi

              if [ -n "$hash" ] && [ "$hash" != "sha256-" ]; then
                sed -i "${target_line}s|sha256 = \"[^\"]*\"|sha256 = \"$hash\"|" "$file"
              fi
            done

            # cargoHash/vendorHash: fake hash trick
            [[ "$file" =~ ^packages/ ]] || continue
            pkg=$(basename "$file" .nix)
            for ht in cargoHash vendorHash; do
              grep -q "$ht" "$file" || continue
              original=$(grep -oP "$ht = \"\K[^\"]+" "$file" | head -1)
              [ "$original" = "$FAKE" ] && continue

              sed -i "s|$ht = \"[^\"]*\"|$ht = \"$FAKE\"|" "$file"
              new=$(timeout 120 nix build .#$pkg --no-link 2>&1 | grep -oP 'got:    sha256-\K[0-9a-zA-Z+/=]+' | head -1 || true)

              if [ -n "$new" ]; then
                sed -i "s|$ht = \"[^\"]*\"|$ht = \"sha256-$new\"|" "$file"
                echo "  $ht: -> sha256-$new"
              else
                sed -i "s|$ht = \"[^\"]*\"|$ht = \"$original\"|" "$file"
                echo "  $ht: failed, keeping original"
              fi
            done
          done

          if ! git diff --quiet; then
            git add -A
            git commit -m "fix: update nix hashes [skip ci]"
            git push
          fi