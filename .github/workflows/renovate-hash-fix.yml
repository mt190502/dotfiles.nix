name: Renovate Hash Fix

on:
  pull_request:
    types: [opened, synchronize]
    branches: ["*"]

jobs:
  fix-hash:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Fix hashes
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          mapfile -t changed < <(git diff --name-only "$BASE_REF" HEAD -- 'packages/**/*.nix')
          [ "${#changed[@]}" -eq 0 ] && { echo "No changed nix files in packages/"; exit 0; }

          # Find every Renovate-managed SRI sha256 value in a file.
          # darwinOutputHash is maintained manually because it cannot be built on Linux.
          # Returns: "<line>:<original_hash>" for each.
          find_hashes() {
            local file="$1"
            grep -nP '^\s*\w+\s*=\s*"sha256-' "$file" 2>/dev/null \
              | grep -v 'darwinOutputHash' \
              | sed -E 's/^([0-9]+):.*"(sha256-[^"]+)".*/\1:\2/'
          }

          # Each line gets a unique valid hash so a mismatch can be mapped back
          # to the exact field that caused it.
          make_fake_hash() {
            local key="$1"
            local hex
            hex=$(printf '%s' "$key" | sha256sum | cut -d ' ' -f 1)
            nix hash convert --hash-algo sha256 --to sri "$hex"
          }

          # Returns: "<specified_hash> <actual_hash>" for the first mismatch.
          extract_mismatch() {
            perl -ne '
              if (/specified:\s+(sha256-\S+)/) { $specified = $1; }
              if (defined $specified && /got:\s+(sha256-\S+)/) {
                print "$specified $1\n";
                exit;
              }
            '
          }

          # Detect current system dynamically
          SYSTEM="$(uname -m)-linux"

          # Discover all nixosConfiguration host names dynamically
          get_hosts() {
            nix eval --json .#nixosConfigurations --apply 'builtins.attrNames' 2>/dev/null \
              | tr -d '[]" ' | tr ',' ' '
          }

          # Try to trigger the hash mismatch via targeted build
          trigger_build() {
            local file="$1"
            local mismatch=""

            # Strategy 1: build the specific package directly by pname
            # Skip if pname contains $ (template string, not a real name)
            local pname
            pname=$(grep -oP 'pname\s*=\s*"\K[^"]+' "$file" 2>/dev/null | head -1) || true
            if [ -n "$pname" ] && [[ "$pname" != *'$'* ]]; then
              local drv=""
              drv=$(timeout 60 nix eval --raw .#legacyPackages."$SYSTEM"."$pname".drvPath 2>/dev/null) || \
              drv=$(timeout 60 nix eval --raw .#packages."$SYSTEM"."$pname".drvPath 2>/dev/null)
              if [ -n "$drv" ]; then
                mismatch=$(timeout 300 nix-store -r "$drv" 2>&1 | extract_mismatch) || true
              fi
            fi

            # Strategy 1.5: try all legacyPackages function attributes
            # Discovers functions dynamically using only builtins, evaluates drvPath, then builds it
            if [ -z "$mismatch" ]; then
              local ext_name funcs
              ext_name=$(basename "$file" .nix)
              # shellcheck disable=SC2016 # ${n} belongs to the quoted Nix expression.
              funcs=$(timeout 60 nix eval --json .#legacyPackages."$SYSTEM" --apply \
                'attrs: builtins.concatMap (n: let v = builtins.tryEval (attrs.${n}); in if v.success && builtins.isFunction v.value then [n] else []) (builtins.attrNames attrs)' 2>/dev/null \
                | tr -d '[]" ' | tr ',' ' ') || true
              for func in $funcs; do
                local drv
                drv=$(timeout 60 nix eval --raw .#legacyPackages."$SYSTEM"."$func" \
                  --apply "f: (f [\"$ext_name\"]).\"$ext_name\".drvPath" 2>/dev/null) || true
                if [ -n "$drv" ]; then
                  mismatch=$(timeout 300 nix-store -r "$drv" 2>&1 | extract_mismatch) || true
                  [ -n "$mismatch" ] && break
                fi
              done
            fi

            # Strategy 2: build first nixosConfiguration (forces home-manager → vicinae → raycastExtensions)
            if [ -z "$mismatch" ]; then
              local first_host
              first_host=$(get_hosts | awk '{print $1}') || true
              if [ -n "$first_host" ]; then
                mismatch=$(timeout 300 nix build .#nixosConfigurations."$first_host".config.system.build.toplevel --no-link 2>&1 | extract_mismatch) || true
              fi
            fi

            echo "$mismatch"
          }

          process_file() {
            local file="$1"
            local entry fake line original mismatch specified actual
            local -a entries=()
            declare -A originals=()
            declare -A lines=()

            mapfile -t entries < <(find_hashes "$file")
            [ "${#entries[@]}" -eq 0 ] && return 0

            echo "=== $file ==="
            for entry in "${entries[@]}"; do
              IFS=: read -r line original <<< "$entry"
              fake=$(make_fake_hash "$file:$line")
              sed -i "${line}s|sha256-[^\"]*|$fake|" "$file"
              originals["$fake"]="$original"
              lines["$fake"]="$line"
            done

            while [ "${#lines[@]}" -gt 0 ]; do
              mismatch=$(trigger_build "$file")
              [ -z "$mismatch" ] && break
              read -r specified actual <<< "$mismatch"
              line="${lines[$specified]:-}"
              [ -z "$line" ] && break

              sed -i "${line}s|$specified|$actual|" "$file"
              unset 'originals['"$specified"']'
              unset 'lines['"$specified"']'
              echo "  $file:$line -> $actual"
            done

            if [ "${#lines[@]}" -gt 0 ]; then
              echo "Could not resolve every hash in $file; restoring original values" >&2
              for fake in "${!lines[@]}"; do
                line="${lines[$fake]}"
                original="${originals[$fake]}"
                sed -i "${line}s|$fake|$original|" "$file"
              done
              return 1
            fi
          }

          failed=0
          for file in "${changed[@]}"; do
            [ -f "$file" ] || continue
            process_file "$file" || failed=1
          done
          [ "$failed" -eq 0 ] || exit 1

      - name: Commit and push
        run: |
          if [[ -z $(git status -s) ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "fix(automated): update nix hashes [skip ci]"
          git push
