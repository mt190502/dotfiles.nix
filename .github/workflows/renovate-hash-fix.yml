name: Renovate Hash Fix

on:
  pull_request:
    types: [opened, synchronize]
    branches: ["*"]

jobs:
  fix-hash:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Update SHA256 hashes
        run: |
          changed_files=$(git diff --name-only origin/${{ github.base_ref }} HEAD -- '*.nix')
          
          for file in $changed_files; do
            echo "=== Processing $file ==="
            
            owner=$(grep -oP 'owner = "\K[^"]+' "$file" | head -1 || true)
            
            if grep -q 'repo = pname' "$file"; then
              repo=$(grep -oP 'pname = "\K[^"]+' "$file" | head -1 || true)
            else
              repo=$(grep -oP 'repo = "\K[^"]+' "$file" | head -1 || true)
            fi
            
            if grep -q 'rev = version' "$file"; then
              rev=$(grep -oP 'version = "\K[^"]+' "$file" | head -1 || true)
            else
              rev=$(grep -oP 'rev = "\K[^"]+' "$file" | head -1 || true)
            fi
            
            old_sha=$(grep -oP 'sha256 = "\K[^"]+' "$file" | head -1 || true)
            
            if [[ -n "$owner" && -n "$repo" && -n "$rev" && -n "$old_sha" ]]; then
              echo "Found: owner=$owner, repo=$repo, rev=$rev"
              
              new_sha=$(nix-prefetch-url --unpack "https://github.com/$owner/$repo/archive/$rev.tar.gz" 2>&1 | tail -1)
              
              if [[ -n "$new_sha" ]]; then
                new_sha_base64="sha256-$(nix hash convert --hash-algo sha256 --to base64 "$new_sha")"
                
                if [[ "$old_sha" != "$new_sha_base64" ]]; then
                  awk -v old="$old_sha" -v new="$new_sha_base64" '{
                    gsub("sha256 = \"" old "\"", "sha256 = \"" new "\"")
                    print
                  }' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
                  echo "Updated sha256: $old_sha -> $new_sha_base64"
                fi
              fi
            fi
          done

      - name: Update cargoHash/vendorHash
        run: |
          changed_files=$(git diff --name-only origin/${{ github.base_ref }} HEAD -- '*.nix')
          
          for file in $changed_files; do
            if grep -qE 'cargoHash|vendorHash' "$file"; then
              echo "=== Updating cargoHash/vendorHash in $file ==="
              
              fake_hash="sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
              
              old_cargo=$(grep -oP 'cargoHash = "\K[^"]+' "$file" | head -1 || true)
              old_vendor=$(grep -oP 'vendorHash = "\K[^"]+' "$file" | head -1 || true)
              
              if [[ -n "$old_cargo" ]]; then
                # Replace with fake hash to trigger calculation
                awk -v old="$old_cargo" -v new="$fake_hash" '{
                  gsub("cargoHash = \"" old "\"", "cargoHash = \"" new "\"")
                  print
                }' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
                
                # Calculate hash using nix-prefetch
                pname=$(grep -oP 'pname = "\K[^"]+' "$file" | head -1)
                version=$(grep -oP 'version = "\K[^"]+' "$file" | head -1)
                owner=$(grep -oP 'owner = "\K[^"]+' "$file" | head -1)
                
                if [[ -n "$pname" && -n "$version" && -n "$owner" ]]; then
                  # Fetch source and calculate cargo hash
                  src_hash=$(nix-prefetch-url --unpack "https://github.com/$owner/$pname/archive/$version.tar.gz" 2>&1 | tail -1)
                  
                  # Use nix to calculate cargo dependencies hash
                  new_hash=$(nix eval --impure --expr "
                    let
                      pkgs = import <nixpkgs> {};
                      src = builtins.fetchTarball {
                        url = \"https://github.com/$owner/$pname/archive/$version.tar.gz\";
                        sha256 = \"$src_hash\";
                      };
                      cargoToml = builtins.fromTOML (builtins.readFile \"$src/Cargo.toml\");
                    in builtins.hashString \"sha256\" (builtins.concatStringsSep \"\" (map (d: d.name ++ d.version) cargoToml.dependencies))
                  " 2>&1 | tail -1 || true)
                  
                  # Alternative: just build and get from error
                  if [[ -z "$new_hash" ]]; then
                    new_hash=$(timeout 120 nix build .#nixosConfigurations.lenovo-thinkpad-e14-nixos-personal.config.system.build.toplevel 2>&1 | grep -oP 'got:    sha256-\K[0-9a-zA-Z+/=]+' | head -1 || true)
                  fi
                  
                  if [[ -n "$new_hash" ]]; then
                    awk -v old="$fake_hash" -v new="sha256-$new_hash" '{
                      gsub("cargoHash = \"" old "\"", "cargoHash = \"" new "\"")
                      print
                    }' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
                    echo "Updated cargoHash: $old_cargo -> sha256-$new_hash"
                  else
                    awk -v old="$fake_hash" -v new="$old_cargo" '{
                      gsub("cargoHash = \"" old "\"", "cargoHash = \"" new "\"")
                      print
                    }' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
                    echo "Failed to calculate cargoHash, keeping original"
                  fi
                fi
              fi
              
              if [[ -n "$old_vendor" ]]; then
                awk -v old="$old_vendor" -v new="$fake_hash" '{
                  gsub("vendorHash = \"" old "\"", "vendorHash = \"" new "\"")
                  print
                }' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
                
                pname=$(grep -oP 'pname = "\K[^"]+' "$file" | head -1)
                version=$(grep -oP 'version = "\K[^"]+' "$file" | head -1)
                owner=$(grep -oP 'owner = "\K[^"]+' "$file" | head -1)
                
                if [[ -n "$pname" && -n "$version" && -n "$owner" ]]; then
                  src_hash=$(nix-prefetch-url --unpack "https://github.com/$owner/$pname/archive/$version.tar.gz" 2>&1 | tail -1)
                  
                  new_hash=$(timeout 120 nix build .#nixosConfigurations.lenovo-thinkpad-e14-nixos-personal.config.system.build.toplevel 2>&1 | grep -oP 'got:    sha256-\K[0-9a-zA-Z+/=]+' | head -1 || true)
                  
                  if [[ -n "$new_hash" ]]; then
                    awk -v old="$fake_hash" -v new="sha256-$new_hash" '{
                      gsub("vendorHash = \"" old "\"", "vendorHash = \"" new "\"")
                      print
                    }' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
                    echo "Updated vendorHash: $old_vendor -> sha256-$new_hash"
                  else
                    awk -v old="$fake_hash" -v new="$old_vendor" '{
                      gsub("vendorHash = \"" old "\"", "vendorHash = \"" new "\"")
                      print
                    }' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
                    echo "Failed to calculate vendorHash, keeping original"
                  fi
                fi
              fi
            fi
          done

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git add -A
          git commit -m "fix: update nix hashes [skip ci]"
          git push