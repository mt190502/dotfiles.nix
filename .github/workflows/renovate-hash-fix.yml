name: Renovate Hash Fix

on:
  pull_request:
    types: [opened, synchronize]
    branches: ["*"]

jobs:
  fix-hash:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Fix hashes
        env:
          BASE_REF: origin/${{ github.base_ref }}
          FAKE: sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          changed=$(git diff --name-only "$BASE_REF" HEAD -- 'packages/**/*.nix')
          [ -z "$changed" ] && { echo "No changed nix files in packages/"; exit 0; }

          # Find every line in changed files that has a SRI sha256 value
          # Returns: "<file>:<line>:<original_hash>" for each
          find_all_hashes() {
            for file in $changed; do
              [ -f "$file" ] || continue
              grep -nP '^\s*\w+\s*=\s*"sha256-' "$file" 2>/dev/null \
                | sed -E 's/^([0-9]+):.*"sha256-([^"]+)".*/\1:sha256-\2/' \
                | while IFS=: read -r ln hash; do
                    [ "$hash" = "$FAKE" ] && continue
                    echo "$file:$ln:$hash"
                  done
            done
          }

          # Extract correct hash from nix error output
          extract_hash() {
            grep -oP 'got:    sha256-\K[0-9a-zA-Z+/=]+' | head -1 || true
          }

          # Discover all nixosConfiguration host names dynamically
          get_hosts() {
            nix eval --json .#nixosConfigurations --apply 'builtins.attrNames' 2>/dev/null \
              | tr -d '[]" ' | tr ',' ' '
          }

          # Try to trigger the hash mismatch via multiple evaluation paths
          trigger_build() {
            local got=""

            # Path 1: nix flake check evaluates all outputs on all systems
            got=$(timeout 600 nix flake check --all-systems 2>&1 | extract_hash)

            # Path 2: build nixosConfigurations (forces home-manager → vicinae → raycastExtensions)
            if [ -z "$got" ]; then
              for host in $(get_hosts); do
                got=$(timeout 600 nix build .#nixosConfigurations."$host".config.system.build.toplevel --no-link 2>&1 | extract_hash)
                [ -n "$got" ] && break
              done
            fi

            echo "$got"
          }

          # Process each hash: set FAKE → trigger build → write correct hash
          find_all_hashes | while IFS=: read -r file ln original; do
            echo "=== $file:$ln ==="
            sed -i "${ln}s|sha256-[^\"]*|$FAKE|" "$file"

            got=$(trigger_build)

            if [ -n "$got" ]; then
              sed -i "${ln}s|sha256-[^\"]*|sha256-$got|" "$file"
              echo "  -> sha256-$got"
            else
              sed -i "${ln}s|sha256-[^\"]*|$original|" "$file"
              echo "  failed, keeping original"
            fi
          done

      - name: Commit and push
        run: |
          if [[ -z $(git status -s) ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "fix(automated): update nix hashes [skip ci]"
          git push
